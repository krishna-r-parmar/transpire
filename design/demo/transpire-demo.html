<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRANSPIRE Design Demo</title>
<style>
  /* Tokens taken from the current app (home.module.css, admin-shell.module.css). */
  :root {
    --blue: oklch(59.157% .14157 242.451);
    --blue-deep: oklch(45% .12 242);
    --blue-soft: oklch(94% .025 242);
    --red: oklch(62.236% .22144 23.472);
    --ink: oklch(22% .047 253);
    --muted: oklch(45% .025 248);
    --paper: oklch(98.5% .006 240);
    --surface: oklch(100% 0 0);
    --panel: oklch(95.5% .012 242);
    --line: oklch(86% .02 242);
    --line-strong: oklch(75% .055 242);
    --header: oklch(95.5% .022 242);
    --header-line: oklch(77% .045 242);
    --success: oklch(42% .1 150); --success-soft: oklch(94% .04 150); --success-line: oklch(76% .08 150);
    --warning: oklch(43% .1 75);  --warning-soft: oklch(96% .045 80); --warning-line: oklch(78% .09 80);
    --danger: oklch(44% .14 23);  --danger-soft: oklch(95% .035 23); --danger-line: oklch(79% .075 23);
    --font: Aptos, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    --ease: cubic-bezier(.16, 1, .3, 1);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --blue: oklch(70% .13 242); --blue-deep: oklch(78% .1 242); --blue-soft: oklch(30% .05 245);
    --ink: oklch(94% .01 245); --muted: oklch(76% .02 245);
    --paper: oklch(19% .025 250); --surface: oklch(23% .03 250); --panel: oklch(26% .03 250);
    --line: oklch(34% .03 250); --line-strong: oklch(48% .05 245);
    --header: oklch(24% .035 250); --header-line: oklch(36% .04 248);
    --success: oklch(80% .12 150); --success-soft: oklch(30% .05 150); --success-line: oklch(45% .08 150);
    --warning: oklch(84% .12 85);  --warning-soft: oklch(31% .05 80);  --warning-line: oklch(48% .08 80);
    --danger: oklch(78% .12 23);   --danger-soft: oklch(30% .06 23);   --danger-line: oklch(48% .1 23);
    color-scheme: dark;
  }
  /* Text size setting: everything below is in rem. */
  html { font-size: 100%; }
  html[data-size="large"] { font-size: 112.5%; }
  html[data-size="larger"] { font-size: 125%; }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: .9375rem; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  svg.i { width: 1.05rem; height: 1.05rem; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Header (same as current) ---------- */
  .header { position: sticky; z-index: 20; top: 0; display: grid; min-height: 5.25rem; align-items: center; gap: clamp(.75rem, 2vw, 1.75rem); border-bottom: 1px solid var(--header-line); padding: 0 clamp(1.25rem, 3vw, 2.6rem); background: var(--header); box-shadow: 0 .35rem 1rem oklch(28% .055 250 / .08); grid-template-columns: auto minmax(0, 1fr) auto; }
  .header .logo img { display: block; width: 11rem; height: auto; }
  :root[data-theme="dark"] .header .logo img { filter: brightness(0) invert(1); }
  .nav { display: flex; justify-content: flex-end; gap: .38rem; min-width: 0; }
  .route { display: inline-flex; min-height: 2.6rem; align-items: center; gap: .4rem; border: 1px solid oklch(84% .028 242); border-radius: .25rem; padding: .5rem .8rem; background: oklch(98% .008 242); color: oklch(31% .05 250); font-size: .875rem; font-weight: 700; white-space: nowrap; transition: border-color 160ms ease-out, background 160ms ease-out; }
  :root[data-theme="dark"] .route { background: var(--surface); border-color: var(--line); color: var(--ink); }
  .route:hover { border-color: oklch(68% .065 242); background: oklch(94% .025 242); }
  :root[data-theme="dark"] .route:hover { background: var(--panel); }
  .route[aria-current="page"] { border-color: oklch(51% .13 242); background: oklch(45% .12 242); color: oklch(98% .006 242); box-shadow: 0 4px 12px oklch(38% .1 242 / .16); }
  .count { min-width: 1.3rem; padding: 0 .3rem; border-radius: 99px; background: var(--red); color: #fff; font-size: .75rem; font-weight: 800; text-align: center; }
  .tools { display: flex; align-items: center; gap: .38rem; }
  .tool { position: relative; display: inline-grid; min-width: 2.6rem; height: 2.6rem; padding: 0 .6rem; place-items: center; border: 1px solid oklch(84% .028 242); border-radius: .25rem; background: oklch(98% .008 242); cursor: pointer; font-weight: 800; font-size: .9rem; color: oklch(31% .05 250); }
  :root[data-theme="dark"] .tool { background: var(--surface); border-color: var(--line); color: var(--ink); }
  .tool:hover { border-color: oklch(68% .065 242); }
  .tool .count { position: absolute; top: -.4rem; right: -.4rem; }
  .avatar { display: inline-grid; width: 2.6rem; height: 2.6rem; place-items: center; border-radius: 50%; background: var(--blue-deep); color: var(--surface); font-size: .85rem; font-weight: 800; flex: none; }
  .avatar.soft { width: 2.1rem; height: 2.1rem; background: var(--blue-soft); color: var(--blue-deep); font-size: .75rem; }
  .menu-btn { display: none; }
  .pop { position: absolute; right: 0; top: calc(100% + .45rem); z-index: 30; display: none; width: 18rem; border: 1px solid var(--line); border-radius: .4rem; padding: 1rem; background: var(--surface); box-shadow: 0 1.1rem 2.8rem oklch(25% .04 250 / .16); text-align: left; font-weight: 400; }
  .pop[data-open="true"] { display: block; }
  .pop p { margin: 0 0 .5rem; font-size: .875rem; font-weight: 700; }
  .pop .seg + p { margin-top: 1rem; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line-strong); border-radius: .25rem; overflow: hidden; }
  .seg button { min-height: 2.6rem; border: 0; background: transparent; cursor: pointer; font-weight: 700; font-size: .875rem; }
  .seg button + button { border-left: 1px solid var(--line-strong); }
  .seg button[aria-pressed="true"] { background: var(--blue-deep); color: var(--surface); }
  .mobile-nav { display: none; position: absolute; top: 100%; left: 0; right: 0; padding: .75rem clamp(1.25rem, 3vw, 2.6rem) 1rem; background: var(--header); border-bottom: 1px solid var(--header-line); box-shadow: 0 1rem 2rem oklch(25% .04 250 / .12); }
  .mobile-nav[data-open="true"] { display: grid; gap: .4rem; }
  @media (min-width: 72.01rem) { .mobile-nav[data-open="true"] { display: none; } }

  .demo-note { padding: .45rem 1rem; background: var(--warning-soft); color: var(--warning); text-align: center; font-size: .8125rem; font-weight: 700; }
  .demo-note a { text-decoration: underline; }

  /* ---------- Page ---------- */
  main { width: 100%; max-width: 90rem; margin: 0 auto; padding: clamp(2rem, 4vw, 3.25rem) clamp(1.25rem, 4vw, 3.5rem) 5rem; }
  main:focus { outline: none; }
  .crumbs { display: flex; flex-wrap: wrap; gap: .4rem; margin: 0 0 1rem; padding: 0; list-style: none; color: var(--muted); font-size: .875rem; }
  .crumbs a { color: var(--blue-deep); font-weight: 700; }
  .crumbs li + li::before { content: "/"; margin-right: .4rem; color: var(--line-strong); }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 2rem; }
  .page-head > div { max-width: 50rem; }
  .eyebrow { margin: 0 0 .6rem; color: var(--blue-deep); font-size: .75rem; font-weight: 820; letter-spacing: .1em; text-transform: uppercase; }
  .page-head h1 { margin: 0; font-size: clamp(2rem, 3.4vw, 2.5rem); letter-spacing: -.045em; line-height: 1.05; }
  .page-head p.desc { max-width: 62ch; margin: .85rem 0 0; color: var(--muted); font-size: 1rem; line-height: 1.6; }
  .actions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }

  /* ---------- Buttons (current shapes, readable size) ---------- */
  .btn { display: inline-flex; min-height: 2.75rem; align-items: center; justify-content: center; gap: .45rem; border: 1px solid transparent; border-radius: .25rem; padding: .55rem 1rem; cursor: pointer; font-size: .875rem; font-weight: 760; white-space: nowrap; }
  .btn-primary { background: var(--blue); color: oklch(98% .006 240); }
  :root[data-theme="dark"] .btn-primary { color: oklch(18% .03 250); }
  .btn-primary:hover { background: var(--blue-deep); }
  :root[data-theme="dark"] .btn-primary:hover { background: oklch(78% .1 242); }
  .btn-secondary { border-color: var(--line-strong); background: var(--blue-soft); color: var(--blue-deep); }
  .btn-secondary:hover { border-color: var(--blue); }
  .btn-quiet { border-color: var(--line); background: transparent; color: var(--muted); }
  .btn-quiet:hover { border-color: var(--line-strong); color: var(--ink); }
  .btn-danger { border-color: var(--danger-line); background: transparent; color: var(--danger); }
  .btn-success { background: var(--success); color: oklch(98% .006 240); }
  :root[data-theme="dark"] .btn-success { color: oklch(18% .03 250); }
  .btn-sm { min-height: 2.4rem; padding: .4rem .75rem; font-size: .8125rem; }
  .link { display: inline-flex; align-items: center; gap: .3rem; color: var(--blue-deep); font-size: .875rem; font-weight: 760; }
  .link:hover { text-decoration: underline; }

  /* ---------- Summary strip (current strip, plus icon chip and a note) ---------- */
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 1px; margin-bottom: 1.75rem; border: 1px solid var(--line); border-radius: .4rem; overflow: hidden; background: var(--line); }
  .summary > * { display: flex; align-items: center; gap: .85rem; min-height: 5.5rem; padding: 1rem 1.25rem; background: var(--surface); }
  .summary a:hover { background: var(--panel); }
  .summary .ic { display: grid; width: 2.5rem; height: 2.5rem; place-items: center; border-radius: 50%; background: var(--blue-soft); color: var(--blue-deep); flex: none; }
  .summary .ic.warn { background: var(--warning-soft); color: var(--warning); }
  .summary .ic.ok { background: var(--success-soft); color: var(--success); }
  .summary .ic.bad { background: var(--danger-soft); color: var(--danger); }
  .summary strong { display: block; font-size: 1.6rem; line-height: 1.1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .summary .l { display: block; margin-top: .15rem; font-size: .875rem; font-weight: 700; }
  .summary .n { display: block; color: var(--muted); font-size: .8125rem; }

  /* ---------- Sections: light card with a heading row ---------- */
  .card { border: 1px solid var(--line); border-radius: .4rem; background: var(--surface); }
  .stack > * + * { margin-top: 1.5rem; }
  .card-head { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; padding: 1rem 1.25rem; border-bottom: 1px solid var(--line); }
  .card-head .ic { display: grid; width: 2.2rem; height: 2.2rem; place-items: center; border-radius: .25rem; background: var(--blue-soft); color: var(--blue-deep); flex: none; }
  .card-head .tt { flex: 1 1 14rem; min-width: 0; }
  .card-head h2 { margin: 0; font-size: 1.0625rem; letter-spacing: -.02em; line-height: 1.3; }
  .card-head .tt p { margin: .15rem 0 0; color: var(--muted); font-size: .875rem; }
  .card-head .meta { color: var(--muted); font-size: .875rem; font-weight: 700; }
  .card-head .meta.hot { display: inline-grid; min-width: 1.6rem; height: 1.6rem; place-items: center; border-radius: 99px; background: var(--red); color: #fff; font-size: .8125rem; }
  .card-body { padding: 1.25rem; }
  .card-body.flush { padding: 0; }
  .card.tinted { background: var(--panel); }
  .card.tinted .card-head .ic { background: var(--surface); }

  .grid-main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(19rem, .4fr); gap: 1.5rem; align-items: start; }
  .grid-side { display: grid; grid-template-columns: 16rem minmax(0, 1fr); gap: 1.5rem; align-items: start; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem; }

  /* ---------- Status pill (current pill + icon) ---------- */
  .status { display: inline-flex; align-items: center; gap: .35rem; min-height: 1.85rem; border: 1px solid var(--s-line); border-radius: 999px; padding: .2rem .65rem; background: var(--s-soft); color: var(--s); font-size: .8125rem; font-weight: 800; white-space: nowrap; }
  .status svg { width: .9rem; height: .9rem; stroke-width: 2.4; }
  .s-blue { --s: var(--blue-deep); --s-soft: var(--blue-soft); --s-line: var(--line-strong); }
  .s-green { --s: var(--success); --s-soft: var(--success-soft); --s-line: var(--success-line); }
  .s-amber { --s: var(--warning); --s-soft: var(--warning-soft); --s-line: var(--warning-line); }
  .s-red { --s: var(--danger); --s-soft: var(--danger-soft); --s-line: var(--danger-line); }
  .s-grey { --s: var(--muted); --s-soft: var(--panel); --s-line: var(--line); }
  .type { display: inline-flex; border-radius: 999px; padding: .15rem .55rem; background: var(--blue-soft); color: var(--blue-deep); font-size: .8125rem; font-weight: 780; }

  /* ---------- Tables (current table, larger type) ---------- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { padding: .7rem 1rem; background: var(--panel); color: var(--muted); font-size: .75rem; font-weight: 800; letter-spacing: .06em; text-align: left; text-transform: uppercase; white-space: nowrap; }
  td { border-top: 1px solid var(--line); padding: .85rem 1rem; font-size: .9rem; vertical-align: middle; }
  tbody tr:hover td { background: var(--paper); }
  tr.click { cursor: pointer; }
  td .ref { display: block; margin-bottom: .15rem; color: var(--blue-deep); font-size: .8125rem; font-weight: 800; letter-spacing: .03em; }
  td .t { display: block; font-weight: 780; line-height: 1.35; }
  td .m { display: block; margin-top: .15rem; color: var(--muted); font-size: .8125rem; }
  td.r, th.r { text-align: right; }
  .row-open { display: inline-grid; width: 2.4rem; height: 2.4rem; place-items: center; border: 1px solid var(--line-strong); border-radius: 50%; background: var(--blue-soft); color: var(--blue-deep); }
  .table-foot { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; border-top: 1px solid var(--line); padding: .8rem 1.25rem; color: var(--muted); font-size: .875rem; }
  .pager { display: flex; gap: .3rem; }
  .pager button { min-width: 2.4rem; height: 2.4rem; border: 1px solid var(--line); border-radius: .25rem; background: var(--surface); cursor: pointer; font-weight: 700; }
  .pager button[aria-current="page"] { border-color: var(--blue-deep); background: var(--blue-deep); color: var(--surface); }

  /* ---------- Compact progress line ---------- */
  .progress { margin-top: .6rem; }
  .progress .lbl { display: flex; justify-content: space-between; gap: 1rem; font-size: .8125rem; color: var(--muted); }
  .progress .lbl b { color: var(--ink); font-weight: 780; }
  .segs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; margin-top: .35rem; }
  .segs span { height: .4rem; border-radius: 2px; background: var(--line); }
  .segs span.done { background: var(--blue); }
  .segs span.now { background: var(--blue-deep); }
  .segs span.now.warn { background: oklch(70% .14 75); }
  .bar { height: .45rem; border-radius: 99px; background: var(--panel); overflow: hidden; min-width: 5rem; }
  .bar > span { display: block; height: 100%; border-radius: inherit; background: var(--b, var(--blue)); }
  .bar-row { display: flex; align-items: center; gap: .6rem; }
  .bar-row .bar { flex: 1; }

  /* ---------- Lists ---------- */
  .list > * { display: grid; align-items: center; gap: 1rem; grid-template-columns: auto minmax(0, 1fr) auto; padding: 1rem 1.25rem; border-top: 1px solid var(--line); }
  .list > *:first-child { border-top: 0; }
  .list > a:hover { background: var(--paper); }
  .list .ic { display: grid; width: 2.4rem; height: 2.4rem; place-items: center; border-radius: 50%; background: var(--blue-soft); color: var(--blue-deep); }
  .list .ic.warn { background: var(--warning-soft); color: var(--warning); }
  .list small { display: block; color: var(--blue-deep); font-size: .8125rem; font-weight: 780; }
  .list h3 { margin: .15rem 0; font-size: 1rem; line-height: 1.35; }
  .list p { margin: 0; color: var(--muted); font-size: .875rem; }
  .list .due { display: inline-flex; align-items: center; gap: .3rem; margin-top: .4rem; color: var(--muted); font-size: .8125rem; font-weight: 700; }

  /* ---------- Forms ---------- */
  .field { display: grid; gap: .35rem; margin-bottom: 1.1rem; min-width: 0; }
  .field label, .field .label { font-size: .875rem; font-weight: 760; }
  .req { margin-left: .2rem; color: var(--danger); }
  .opt { margin-left: .35rem; color: var(--muted); font-weight: 500; }
  .hint { margin: 0; color: var(--muted); font-size: .8125rem; line-height: 1.45; }
  .input { width: 100%; min-height: 3rem; border: 1px solid oklch(84% .025 242); border-radius: .25rem; padding: .55rem .8rem; background: var(--paper); font-size: .9375rem; }
  :root[data-theme="dark"] .input { border-color: var(--line-strong); }
  .input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px oklch(59% .14 242 / .13); }
  textarea.input { min-height: 6.5rem; resize: vertical; line-height: 1.5; }
  .ro { display: flex; align-items: center; gap: .5rem; min-height: 3rem; border-radius: .25rem; padding: .55rem .8rem; background: var(--panel); font-weight: 650; }
  .ro small { margin-left: auto; color: var(--muted); font-size: .75rem; font-weight: 600; }
  .ro svg { color: var(--muted); width: .95rem; height: .95rem; }
  .counter { justify-self: end; color: var(--muted); font-size: .8125rem; }
  .row-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 1.25rem; }
  .row-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 1.25rem; }
  .prefix { position: relative; }
  .prefix span { position: absolute; left: .8rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 700; }
  .prefix .input { padding-left: 1.8rem; }
  .filters { display: grid; grid-template-columns: 2fr repeat(3, 1fr); gap: 0 1rem; align-items: end; }
  .filters .field { margin: 0; }

  .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
  .choice { display: flex; gap: .85rem; border: 1px solid var(--line); border-radius: .4rem; padding: 1rem; background: var(--surface); cursor: pointer; text-align: left; }
  .choice:hover { border-color: var(--line-strong); }
  .choice[aria-checked="true"] { border-color: var(--blue); background: var(--blue-soft); box-shadow: inset 0 0 0 1px var(--blue); }
  .choice .radio { display: grid; width: 1.25rem; height: 1.25rem; margin-top: .15rem; place-items: center; border: 2px solid var(--line-strong); border-radius: 50%; background: var(--surface); flex: none; }
  .choice[aria-checked="true"] .radio { border-color: var(--blue); }
  .choice[aria-checked="true"] .radio::after { content: ""; width: .6rem; height: .6rem; border-radius: 50%; background: var(--blue); }
  .choice strong { display: block; font-size: 1rem; }
  .choice .d { display: block; margin-top: .15rem; color: var(--muted); font-size: .875rem; }
  .choice .route-hint { display: block; margin-top: .5rem; color: var(--blue-deep); font-size: .8125rem; font-weight: 700; }

  .sqdcp { display: flex; flex-wrap: wrap; gap: .5rem; }
  .sqdcp button { display: inline-flex; align-items: center; gap: .5rem; min-height: 2.75rem; border: 1px solid oklch(84% .025 242); border-radius: .25rem; padding: .4rem .85rem .4rem .45rem; background: var(--paper); cursor: pointer; font-size: .875rem; font-weight: 700; }
  .sqdcp b { display: grid; width: 1.8rem; height: 1.8rem; place-items: center; border-radius: .2rem; background: var(--panel); color: var(--blue-deep); }
  .sqdcp button[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); }
  .sqdcp button[aria-pressed="true"] b { background: var(--blue-deep); color: var(--surface); }

  .guide { border-radius: .4rem; padding: 1rem 1.1rem; background: var(--blue-soft); color: var(--ink); }
  .guide h3 { display: flex; gap: .5rem; align-items: center; margin: 0 0 .5rem; font-size: .9375rem; color: var(--blue-deep); }
  .guide dl { display: grid; grid-template-columns: 6.5rem 1fr; gap: .45rem .75rem; margin: 0; font-size: .875rem; }
  .guide dt { color: var(--blue-deep); font-weight: 800; }
  .guide dd { margin: 0; }
  .guide p { margin: .75rem 0 0; font-size: .875rem; }
  .calc { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; border: 1px solid var(--success-line); border-radius: .4rem; padding: .85rem 1rem; background: var(--success-soft); }
  .calc strong { color: var(--success); font-size: 1.3rem; }
  .calc span { color: var(--muted); font-size: .8125rem; }
  .upload { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; border: 1px dashed var(--line-strong); border-radius: .4rem; padding: 1rem; background: var(--paper); }
  .upload div { flex: 1 1 14rem; }
  .upload strong { display: block; font-size: .9375rem; }
  .file { display: flex; align-items: center; gap: .7rem; margin-top: .6rem; border: 1px solid var(--line); border-radius: .25rem; padding: .55rem .8rem; font-size: .875rem; }
  .file span { flex: 1; }

  /* Stepper */
  .stepper { display: grid; grid-template-columns: repeat(4, 1fr); margin: 0 0 1.5rem; padding: 0; list-style: none; border: 1px solid var(--line); border-radius: .4rem; background: var(--surface); overflow: hidden; }
  .stepper li + li { border-left: 1px solid var(--line); }
  .stepper button { display: flex; width: 100%; align-items: center; gap: .7rem; border: 0; padding: .85rem 1rem; background: transparent; cursor: pointer; text-align: left; }
  .stepper .n { display: grid; width: 2rem; height: 2rem; place-items: center; border: 2px solid var(--line-strong); border-radius: 50%; font-size: .875rem; font-weight: 800; flex: none; }
  .stepper strong { display: block; font-size: .9rem; }
  .stepper small { display: block; color: var(--muted); font-size: .8125rem; }
  .stepper .done .n { border-color: var(--success); background: var(--success); color: var(--surface); }
  .stepper .now button { background: var(--blue-soft); box-shadow: inset 0 -3px 0 var(--blue); }
  .stepper .now .n { border-color: var(--blue-deep); background: var(--blue-deep); color: var(--surface); }
  .form-bar { position: sticky; bottom: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-top: 1.5rem; border: 1px solid var(--line); border-radius: .4rem; padding: .8rem 1rem; background: var(--surface); box-shadow: 0 -.4rem 1rem oklch(28% .055 250 / .06); }
  .form-bar .spacer { flex: 1; }
  .form-bar .saved { display: inline-flex; gap: .35rem; align-items: center; color: var(--muted); font-size: .8125rem; }

  /* Approval route */
  .route-list { margin: 0; padding: 0; list-style: none; }
  .route-list > li { position: relative; display: flex; gap: .85rem; padding-bottom: 1.1rem; }
  .route-list > li::before { content: ""; position: absolute; left: .95rem; top: 2.1rem; bottom: .15rem; width: 2px; background: var(--line); }
  .route-list > li:last-child { padding-bottom: 0; }
  .route-list > li:last-child::before { display: none; }
  .route-list .n { display: grid; width: 1.9rem; height: 1.9rem; place-items: center; border: 2px solid var(--line-strong); border-radius: 50%; background: var(--surface); font-size: .8125rem; font-weight: 800; flex: none; }
  .route-list .done .n { border-color: var(--success); background: var(--success); color: var(--surface); }
  .route-list .now .n { border-color: var(--blue-deep); background: var(--blue-deep); color: var(--surface); }
  .route-list .warn .n { border-color: oklch(70% .14 75); background: oklch(70% .14 75); color: #fff; }
  .route-list strong { display: block; font-size: .9375rem; }
  .route-list span { display: block; color: var(--muted); font-size: .8125rem; }
  .route-list .who { display: flex; gap: .45rem; align-items: center; margin-top: .3rem; color: var(--ink); font-size: .875rem; font-weight: 700; }
  .route-list .who .avatar { display: inline-grid; }
  .route-list .par { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-top: .45rem; }
  .route-list .par > div { border: 1px solid var(--line); border-radius: .25rem; padding: .5rem .65rem; background: var(--paper); }
  .route-list .final .n { border-style: dashed; color: var(--success); border-color: var(--success); }

  dl.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: 1rem 1.25rem; margin: 0; }
  dl.facts dt { color: var(--muted); font-size: .75rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  dl.facts dd { margin: .2rem 0 0; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  .pair > div { border-radius: .25rem; padding: .85rem 1rem; background: var(--blue-soft); }
  .pair h4 { margin: 0 0 .3rem; color: var(--blue-deep); font-size: .8125rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
  .pair p { margin: 0; font-size: .9375rem; }
  .notice { display: flex; gap: .8rem; align-items: flex-start; margin-bottom: 1.5rem; border: 1px solid var(--n-line); border-radius: .4rem; padding: .9rem 1rem; background: var(--n-soft); }
  .notice svg { color: var(--n); margin-top: .15rem; }
  .notice strong { display: block; }
  .notice p { margin: .15rem 0 0; color: var(--muted); font-size: .875rem; }

  .tabs { display: flex; gap: .25rem; overflow-x: auto; margin-bottom: 1.5rem; border-bottom: 1px solid var(--line); }
  .tabs button { display: inline-flex; align-items: center; gap: .4rem; min-height: 2.9rem; margin-bottom: -1px; border: 0; border-bottom: 3px solid transparent; padding: 0 .9rem; background: transparent; color: var(--muted); cursor: pointer; font-size: .875rem; font-weight: 760; white-space: nowrap; }
  .tabs button[aria-selected="true"] { border-bottom-color: var(--blue-deep); color: var(--blue-deep); }
  .pills { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1rem; }
  .pills button { min-height: 2.4rem; border: 1px solid oklch(84% .028 242); border-radius: .25rem; padding: .3rem .8rem; background: var(--paper); cursor: pointer; font-size: .8125rem; font-weight: 760; }
  .pills button[aria-pressed="true"] { border-color: var(--blue-deep); background: var(--blue-deep); color: var(--surface); }
  .side-nav { display: grid; gap: .2rem; padding: .5rem; }
  .side-nav button { display: flex; align-items: center; gap: .6rem; min-height: 2.75rem; border: 0; border-radius: .25rem; padding: 0 .75rem; background: transparent; cursor: pointer; font-size: .9rem; font-weight: 700; text-align: left; color: var(--muted); }
  .side-nav button[aria-current="true"] { background: var(--blue-soft); color: var(--blue-deep); box-shadow: inset 3px 0 0 var(--blue-deep); }

  .timeline { margin: 0; padding: 0; list-style: none; }
  .timeline li { display: flex; gap: .75rem; padding-bottom: 1rem; }
  .timeline li:last-child { padding-bottom: 0; }
  .timeline .ic { display: grid; width: 2rem; height: 2rem; place-items: center; border-radius: 50%; background: var(--panel); color: var(--muted); flex: none; }
  .timeline strong { display: block; font-size: .9rem; }
  .timeline span { color: var(--muted); font-size: .8125rem; }
  .bars > div { display: grid; grid-template-columns: 6.5rem 1fr 3.5rem; gap: .6rem; align-items: center; padding: .4rem 0; font-size: .875rem; }
  .bars .v { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }

  /* Sign in */
  .signin { display: grid; min-height: 100vh; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .signin-side { display: flex; flex-direction: column; justify-content: center; gap: 2rem; padding: clamp(2rem, 5vw, 5rem); background: var(--header); border-right: 1px solid var(--header-line); }
  .signin-side img { width: 13rem; }
  :root[data-theme="dark"] .signin-side img { filter: brightness(0) invert(1); }
  .signin-side h2 { margin: 0; max-width: 18ch; font-size: clamp(2rem, 3.5vw, 2.75rem); letter-spacing: -.045em; line-height: 1.08; }
  .signin-side ul { display: grid; gap: .75rem; margin: 0; padding: 0; list-style: none; }
  .signin-side li { display: flex; gap: .7rem; align-items: center; color: var(--muted); }
  .signin-side li span { display: grid; width: 2.2rem; height: 2.2rem; place-items: center; border-radius: .25rem; background: var(--surface); color: var(--blue-deep); flex: none; }
  .signin-form { display: grid; place-items: center; padding: 2rem 1.25rem; }
  .signin-form > div { width: 100%; max-width: 25rem; }
  .signin-form h1 { margin: .4rem 0; font-size: 2rem; letter-spacing: -.045em; }
  .or { display: flex; align-items: center; gap: .75rem; margin: 1.1rem 0; color: var(--muted); font-size: .8125rem; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .toast { position: fixed; z-index: 50; right: 1.25rem; bottom: 1.25rem; display: flex; gap: .7rem; align-items: center; max-width: calc(100% - 2.5rem); border: 1px solid var(--success-line); border-radius: .4rem; padding: .85rem 1rem; background: var(--surface); box-shadow: 0 1.1rem 2.8rem oklch(25% .04 250 / .16); font-size: .9rem; font-weight: 700; transform: translateY(160%); transition: transform 240ms var(--ease); }
  .toast[data-show="true"] { transform: none; }
  .toast svg { color: var(--success); }

  @media (max-width: 80rem) { .route .lbl-long { display: none; } }
  @media (max-width: 72rem) {
    .nav { display: none; }
    .menu-btn { display: inline-flex; }
    .grid-main, .grid-side { grid-template-columns: 1fr; }
  }
  @media (max-width: 56rem) {
    .grid-2, .choices, .pair, .signin { grid-template-columns: 1fr; }
    .filters { grid-template-columns: 1fr 1fr; }
    .filters .field:first-child { grid-column: 1 / -1; }
    .stepper { grid-template-columns: 1fr 1fr; }
    .stepper li:nth-child(3) { border-left: 0; }
    .stepper li:nth-child(n+3) { border-top: 1px solid var(--line); }
    .signin-side { border-right: 0; border-bottom: 1px solid var(--header-line); }
    .signin-side ul { display: none; }
  }
  @media (max-width: 40rem) {
    .header { min-height: 4.5rem; }
    .header .logo img { width: 8.5rem; }
    .row-2, .row-3, .filters { grid-template-columns: 1fr; }
    .stepper small { display: none; }
    .summary { grid-template-columns: 1fr 1fr; }
    .summary > * { flex-direction: column; align-items: flex-start; gap: .5rem; padding: .9rem; }
    .list > * { grid-template-columns: auto minmax(0, 1fr); }
    .list > * > :last-child:not(:nth-child(2)) { grid-column: 2; }
    .form-bar .btn { flex: 1 1 auto; }
  }
  @media (prefers-reduced-motion: reduce) { .toast, .route { transition: none; } }
</style>

/* ---------- Shared building blocks ---------- */
const STATUS = {
  draft: ["s-grey", "file-clock", "Draft"], review: ["s-blue", "dot", "In approval"], fix: ["s-amber", "rotate", "Needs correction"],
  approved: ["s-green", "check-c", "Approved"], delivery: ["s-green", "flag", "In delivery"], rejected: ["s-red", "x-c", "Rejected"],
  ontrack: ["s-green", "check-c", "On track"], atrisk: ["s-amber", "alert", "At risk"], delayed: ["s-red", "clock", "Delayed"],
  complete: ["s-blue", "check-c", "Complete"], notstarted: ["s-grey", "clock", "Not started"],
  active: ["s-green", "check-c", "Active"], invited: ["s-blue", "mail", "Invitation sent"], suspended: ["s-grey", "lock", "Suspended"],
  due: ["s-amber", "cal", "Due"], ok: ["s-blue", "cal", "Due"],
};
const status = (k, label) => { const [c, ic, l] = STATUS[k]; return `<span class="status ${c}">${I(ic)}${label || l}</span>`; };

const head = ({ crumbs, eyebrow, title, desc, actions }) => `
  ${crumbs ? `<ol class="crumbs">${crumbs.map(([l, h]) => `<li>${h ? `<a href="#${h}">${l}</a>` : l}</li>`).join("")}</ol>` : ""}
  <header class="page-head"><div>${eyebrow ? `<p class="eyebrow">${eyebrow}</p>` : ""}<h1 tabindex="-1">${title}</h1>${desc ? `<p class="desc">${desc}</p>` : ""}</div>${actions ? `<div class="actions">${actions}</div>` : ""}</header>`;

const card = ({ icon, title, sub, meta, hot, right = "", body = "", flush, tinted }) => `
  <section class="card ${tinted ? "tinted" : ""}" aria-label="${title}">
    <div class="card-head">${icon ? `<span class="ic">${I(icon)}</span>` : ""}<div class="tt"><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ""}</div>${meta !== undefined ? `<span class="meta ${hot ? "hot" : ""}">${meta}</span>` : ""}${right}</div>
    <div class="card-body ${flush ? "flush" : ""}">${body}</div>
  </section>`;

const summary = (items) => `<section class="summary" aria-label="Summary">${items.map(([icon, v, l, n, tone, href]) =>
  `<${href ? `a href="#${href}"` : "div"}><span class="ic ${tone || ""}">${I(icon)}</span><span><strong>${v}</strong><span class="l">${l}</span>${n ? `<span class="n">${n}</span>` : ""}</span></${href ? "a" : "div"}>`).join("")}</section>`;

const field = ({ label, id, req, opt, hint, ctl, count }) => `<div class="field"><label ${id ? `for="${id}"` : ""}>${label}${req ? `<span class="req" aria-hidden="true">*</span><span class="sr"> (required)</span>` : ""}${opt ? `<span class="opt">Optional</span>` : ""}</label>${hint ? `<p class="hint">${hint}</p>` : ""}${ctl}${count ? `<span class="counter">${count}</span>` : ""}</div>`;
const sel = (id, opts, s) => `<select class="input" id="${id}">${opts.map(o => `<option ${o === s ? "selected" : ""}>${o}</option>`).join("")}</select>`;
const ro = (v) => `<div class="ro">${I("lock")}${v}<small>From profile</small></div>`;

const STAGES = ["Drafted", "Submitted", "OE lead review", "Manager approval", "Project charter", "In delivery"];
const progress = (at, warn) => `<div class="progress"><div class="lbl"><span>Step ${at + 1} of 6: <b>${STAGES[at]}</b></span></div><div class="segs" aria-hidden="true">${STAGES.map((_, n) => `<span class="${n < at ? "done" : n === at ? "now" + (warn ? " warn" : "") : ""}"></span>`).join("")}</div></div>`;

const route = (at, warn, parallel) => {
  const st = (n) => n < at ? "done" : n === at ? (warn ? "warn" : "now") : "";
  const mark = (n) => n < at ? I("check") : n + 1;
  return `<ol class="route-list">
    <li class="${st(0)}"><span class="n">${mark(0)}</span><div><strong>OE lead review</strong><span>Checks fit with CI goals and feasibility. 2 working days.</span><span class="who"><span class="avatar soft">AM</span>Ankit Mehta</span>${at > 0 ? `<span>Approved 19 Oct</span>` : warn ? `<span>Asked for a correction on 21 Oct</span>` : ""}</div></li>
    <li class="${st(1)}"><span class="n">${mark(1)}</span><div><strong>Manager approval</strong><span>Confirms people and time are available. 2 working days.</span><span class="who"><span class="avatar soft">RM</span>Rahul Mehta</span>${at === 1 ? `<span>Due Monday, 28 Oct</span>` : ""}</div></li>
    ${parallel ? `<li class="${st(2)}"><span class="n">${mark(2)}</span><div><strong>Site head and Finance, at the same time</strong><span>Both must approve. 5 working days.</span><div class="par"><div><strong>Site head</strong><span>Priya Shah</span></div><div><strong>Finance head</strong><span>Deepa Menon</span></div></div></div></li>` : ""}
    <li class="final"><span class="n">${I("check")}</span><div><strong>Approved</strong><span>${parallel ? "Project charter opens for the idea owner." : "Ready to put into practice."}</span></div></li>
  </ol>`;
};

/* ---------- Shell ---------- */
const NAV = [["home", "home", "Home"], ["submit", "bulb", "Submit an idea"], ["ideas", "list", "Idea Bank"], ["projects", "folder", "Projects"], ["people", "users", "People"], ["config", "sliders", "Configuration"], ["tenants", "building", "Tenants"], ["audit", "history", "Audit"]];
const navLinks = (active) => NAV.map(([k, ic, l]) => `<a class="route" href="#${k}" ${k === active ? 'aria-current="page"' : ""}>${I(ic)}${l}</a>`).join("");
function shell(active, content) {
  return `
  <div class="demo-note">Design demo with sample data. Every page is clickable. <a href="#signin">Sign-in page</a></div>
  <header class="header">
    <a class="logo" href="#home" aria-label="TRANSPIRE home"><img src="${LOGO}" alt="TRANSPIRE"></a>
    <nav class="nav" aria-label="Primary application navigation">${navLinks(active)}</nav>
    <div class="tools">
      <div style="position:relative"><button class="tool" id="setBtn" aria-expanded="false" aria-controls="setPop" aria-label="Text size and appearance">Aa</button>
        <div class="pop" id="setPop" role="dialog" aria-label="Reading settings"><p>Text size</p><div class="seg" data-setting="size"><button data-value="standard">A</button><button data-value="large" style="font-size:1rem">A</button><button data-value="larger" style="font-size:1.15rem">A</button></div><p>Appearance</p><div class="seg" data-setting="theme" style="grid-template-columns:1fr 1fr"><button data-value="light">Light</button><button data-value="dark">Dark</button></div></div></div>
      <a class="tool" href="#approvals" aria-label="Approvals, 2 waiting">${I("bell")}<span class="count" aria-hidden="true">2</span></a>
      <a class="avatar" href="#profile" aria-label="Profile, Anita Rao">AR</a>
      <button class="tool menu-btn" id="menuBtn" aria-expanded="false" aria-controls="mobileNav" aria-label="Menu">${I("menu")}</button>
    </div>
    <nav class="mobile-nav" id="mobileNav" aria-label="Application menu">${navLinks(active)}</nav>
  </header>
  <main tabindex="-1">${content}</main>`;
}

const settings = { size: "standard", theme: "light" };
function apply(k, v) {
  settings[k] = v; const r = document.documentElement;
  if (k === "size") v === "standard" ? r.removeAttribute("data-size") : r.dataset.size = v;
  if (k === "theme") r.dataset.theme = v;
  try { localStorage.setItem("tpd-" + k, v); } catch {}
  sync();
}
function sync() {
  document.querySelectorAll(".seg").forEach(s => s.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.value === settings[s.dataset.setting])));
  const ts = document.getElementById("ts"); if (ts) ts.value = settings.size[0].toUpperCase() + settings.size.slice(1);
}

let last;
function render() {
  const key = location.hash.slice(1) || "signin";
  const p = pages[key] || pages.home;
  document.getElementById("root").innerHTML = p.bare ? p.render() : shell(p.nav, p.render());
  sync();
  if (key !== last) { scrollTo(0, 0); document.querySelector("h1")?.focus({ preventScroll: true }); }
  last = key;
  document.title = `${document.querySelector("h1")?.textContent || "TRANSPIRE"} | TRANSPIRE demo`;
}
addEventListener("hashchange", render);
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, a, tr.click");
  const pop = document.getElementById("setPop"), mob = document.getElementById("mobileNav");
  if (pop && !e.target.closest("#setPop, #setBtn")) { pop.dataset.open = "false"; document.getElementById("setBtn").setAttribute("aria-expanded", "false"); }
  if (mob && !e.target.closest("#mobileNav, #menuBtn")) { mob.dataset.open = "false"; document.getElementById("menuBtn").setAttribute("aria-expanded", "false"); }
  if (!t) return;
  if (t.dataset.toast) toast(t.dataset.toast);
  if (t.id === "setBtn") { const o = pop.dataset.open !== "true"; pop.dataset.open = o; t.setAttribute("aria-expanded", o); return; }
  if (t.id === "menuBtn") { const o = mob.dataset.open !== "true"; mob.dataset.open = o; t.setAttribute("aria-expanded", o); return; }
  if (t.closest(".seg")) { apply(t.closest(".seg").dataset.setting, t.dataset.value); return; }
  if (t.matches("tr.click") && !e.target.closest("a, button")) { location.hash = t.dataset.href; return; }
  if (t.dataset.goto !== undefined) { step = +t.dataset.goto; render(); scrollTo(0, 0); return; }
  if (t.dataset.type) { ideaType = t.dataset.type; render(); return; }
  if (t.dataset.sq) { sq.has(t.dataset.sq) ? sq.delete(t.dataset.sq) : sq.add(t.dataset.sq); render(); return; }
  if (t.dataset.bf) { bankFilter = t.dataset.bf; render(); return; }
  if (t.dataset.pt) { ptab = +t.dataset.pt; render(); return; }
  if (t.dataset.cfg) { cfg = +t.dataset.cfg; render(); return; }
  if (t.matches(".choice[role=radio]")) t.parentElement.querySelectorAll(".choice").forEach(c => c.setAttribute("aria-checked", c === t));
});
document.addEventListener("change", (e) => { if (e.target.id === "ts") apply("size", e.target.value.toLowerCase()); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { const p = document.getElementById("setPop"); if (p) p.dataset.open = "false"; const m = document.getElementById("mobileNav"); if (m) m.dataset.open = "false"; } });
try { ["size", "theme"].forEach(k => { const v = localStorage.getItem("tpd-" + k); if (v) apply(k, v); }); } catch {}
render();
</script>
