services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://transpire:change-me@database:5432/transpire}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  email-worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    command: ["python", "scripts/process_email_outbox.py", "--watch"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://transpire:change-me@database:5432/transpire}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transpire}
      POSTGRES_USER: ${POSTGRES_USER:-transpire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transpire} -d ${POSTGRES_DB:-transpire}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
