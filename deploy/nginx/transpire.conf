# Reference Nginx site for TRANSPIRE. Adapt certificate paths and the domain.
# Install: /etc/nginx/sites-available/transpire.conf, symlinked into sites-enabled.

upstream transpire_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream transpire_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name transpire.your-company.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name transpire.your-company.com;

    ssl_certificate     /etc/ssl/transpire/fullchain.pem;
    ssl_certificate_key /etc/ssl/transpire/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Profile photos are up to 2 MB; leave headroom for JSON/multipart overhead.
    client_max_body_size 5m;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Host must match ALLOWED_HOSTS in deploy/backend.env.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout 60s;

    location /api/ {
        proxy_pass http://transpire_backend;
    }

    location /health/ {
        proxy_pass http://transpire_backend;
    }

    location /_next/static/ {
        proxy_pass http://transpire_frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://transpire_frontend;
    }
}
