# Production stack for a single EC2 host. PostgreSQL runs outside Docker
# (natively on this host or on a separate server) and is reached via DATABASE_URL.
# Nginx on the host terminates TLS and proxies to the loopback-only ports below.
#
# Images are built on this host from the checked-out repo by deploy/deploy.sh,
# which the GitHub Actions Deploy workflow runs through AWS SSM.
# Deploy loads the root .env for public build inputs and backend services.

name: transpire

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in the root .env}
        NEXT_PUBLIC_CSRF_COOKIE_NAME: ${NEXT_PUBLIC_CSRF_COOKIE_NAME:-transpire_csrf}
    image: transpire-frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [transpire]
    logging: *default-logging

  backend:
    build:
      context: ../backend
    image: transpire-backend:latest
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:8000:8000"
    # Port 8000 is bound to loopback only, so the sole external client is the
    # host's Nginx; trusting its X-Forwarded-* headers is safe.
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --workers=2
      - --proxy-headers
      - --forwarded-allow-ips=*
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [transpire]
    logging: *default-logging

  email-worker:
    image: transpire-backend:latest
    pull_policy: never
    restart: unless-stopped
    env_file:
      - ../.env
    command: ["python", "scripts/process_email_outbox.py", "--watch"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    networks: [transpire]
    logging: *default-logging

networks:
  transpire:
    ipam:
      config:
        # Fixed subnet so the host's pg_hba.conf can allow exactly this range.
        - subnet: 172.30.0.0/24
