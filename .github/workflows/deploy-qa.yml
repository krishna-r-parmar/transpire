name: Deploy QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: deploy-qa

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      INSTANCE_ID: i-0edc0d79289958bca
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::541389077950:role/Actions-deploy-transpire
          aws-region: ap-south-1

      - name: Run deploy on server
        run: |
          ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters '{"commands":["sudo -H -u ubuntu bash -c '\''cd /home/ubuntu/transpire && bash ./deploy.sh'\''"],"executionTimeout":["1800"]}' \
            --timeout-seconds 900 \
            --query Command.CommandId --output text)
          echo "SSM command: $ID"

          # `aws ssm wait command-executed` gives up after ~100s, which is
          # shorter than a server-side build, so poll for up to 30 minutes.
          STATUS=Pending
          for _ in $(seq 1 360); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' --output yaml
          [ "$STATUS" = "Success" ]
