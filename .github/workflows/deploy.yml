name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full commit SHA to deploy or roll back to. Leave empty to deploy the selected branch head."
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - id: sha
        env:
          SHA: ${{ inputs.commit_sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Commit must be a full 40-character SHA, got '$SHA'"
            exit 1
          fi
          echo "value=$SHA" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Pull, rebuild and restart on EC2 via SSM
        env:
          SHA: ${{ steps.sha.outputs.value }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          APP_DIR: ${{ vars.APP_DIR || '/opt/transpire' }}
        run: |
          parameters=$(jq -nc --arg dir "$APP_DIR" --arg sha "$SHA" '{
            commands: [
              "set -e",
              "cd \($dir)",
              "sudo -H -u ubuntu git fetch --quiet origin",
              "sudo -H -u ubuntu git checkout --quiet --detach \($sha)",
              "sudo -H -u ubuntu bash deploy/deploy.sh"
            ],
            executionTimeout: ["1800"]
          }')

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "TRANSPIRE deploy ${SHA:0:12}" \
            --parameters "$parameters" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          status=Pending
          for _ in $(seq 1 380); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          echo "::group::Server output"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          echo "::endgroup::"

          echo "SSM status: $status"
          [[ "$status" == Success ]]

      - name: Smoke test
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "https://$APP_DOMAIN/health/ready"
          curl -fsS -o /dev/null --retry 3 --retry-delay 5 "https://$APP_DOMAIN/sign-in"
